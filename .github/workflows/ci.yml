name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        # O prefixo do Strauss (vendor-prefixed/) roda sozinho aqui, via
        # post-install-cmd do composer.json — não é um passo à parte.
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Verify Strauss prefix is the one actually loaded
        run: |
          php -r '
            require "vendor/autoload.php";
            $original = class_exists("YahnisElsts\\PluginUpdateChecker\\v5\\PucFactory");
            $prefixed = class_exists("V3R\\Core\\Vendor\\YahnisElsts\\PluginUpdateChecker\\v5\\PucFactory");
            fwrite(STDOUT, "original=" . var_export($original, true) . " prefixed=" . var_export($prefixed, true) . "\n");
            if ($original || !$prefixed) {
                fwrite(STDERR, "Strauss prefix não está em uso em runtime.\n");
                exit(1);
            }
          '

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --no-coverage

  lint:
    name: Lint (PHPCS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPCS
        run: ./vendor/bin/phpcs

  analyse:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        # O prefixo do Strauss (vendor-prefixed/) roda sozinho aqui, via
        # post-install-cmd do composer.json — não é um passo à parte.
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress
